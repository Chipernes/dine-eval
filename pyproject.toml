[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dine-eval"
version = "0.1.0"
description = "DINE: a domain-adapted, interpretable LLM-as-a-judge method for evaluating restaurant AI-assistant responses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nikita Motytskyi" },
    { name = "Mykola Fant" },
]
keywords = ["llm", "llm-as-a-judge", "evaluation", "nlp", "restaurant", "hospitality", "prompt-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # core uses only the standard library

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/OWNER/dine-eval"
Repository = "https://github.com/OWNER/dine-eval"
Issues = "https://github.com/OWNER/dine-eval/issues"

[tool.setuptools.packages.find]
where = ["src"]
